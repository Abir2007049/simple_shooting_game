<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Retro Neon Space Shooter</title>
    <style>
        body {
            margin: 0;
            background-color: #050510;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            /* Prevents phone browser from zooming or scrolling when you tap fast */
            touch-action: none; 
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #ui {
            font-size: 20px;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 30px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.1);
        }
        #score {
            color: #00ffcc;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        canvas {
            border: 4px solid #1a1a3a;
            border-radius: 8px;
            background: radial-gradient(circle, #09091e 0%, #03030d 100%);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15);
            max-width: 95vw;
            max-height: 65vh;
        }
        /* Mobile Control Layout */
        #mobile-controls {
            display: none; /* Hidden on PC, enabled below via Media Query */
            width: 100%;
            max-width: 400px;
            justify-content: space-between;
            padding: 15px 20px;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .dpad-container {
            display: flex;
            gap: 10px;
        }
        .btn {
            background: rgba(26, 26, 58, 0.6);
            border: 2px solid #00ffcc;
            color: #00ffcc;
            border-radius: 50%;
            width: 65px;
            height: 65px;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
            touch-action: none;
        }
        .btn:active {
            background: rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.6);
        }
        #btn-shoot {
            border-color: #ff3366;
            color: #ff3366;
            box-shadow: 0 0 15px rgba(255, 51, 102, 0.3);
            width: 75px;
            height: 75px;
            border-radius: 50%;
        }
        #btn-shoot:active {
            background: rgba(255, 51, 102, 0.3);
            box-shadow: 0 0 25px rgba(255, 51, 102, 0.6);
        }

        /* Detect Mobile Screens and show controls */
        @media (max-width: 768px) {
            #mobile-controls {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <!-- Virtual controller for touch-screen mobile devices -->
    <div id="mobile-controls">
        <div class="dpad-container">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="btn" id="btn-shoot">🚀</div>
    </div>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");

// Game State Variables
let score = 0;
let gameOver = false;
let bullets = [];
let enemies = [];
let spawnTimeoutId = null;

// Player Ship Config
const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 50,
    w: 40,
    h: 30,
    speed: 6,
    color: "#00ffcc"
};

// Track inputs
const keys = {};
window.addEventListener("keydown", (e) => keys[e.key] = true);
window.addEventListener("keyup", (e) => keys[e.key] = false);

// PC Keyboard Actions
window.addEventListener("keydown", (e) => {
    if (e.key === " " && !gameOver) {
        fireLaser();
    }
    if ((e.key === "r" || e.key === "R") && gameOver) {
        resetGame();
    }
});

// Central Fire Logic
function fireLaser() {
    bullets.push({ 
        x: player.x + player.w / 2 - 2, 
        y: player.y, 
        w: 4, 
        h: 12, 
        speed: 9 
    });
}

// Android Touch Controls Mapping
const leftBtn = document.getElementById("btn-left");
const rightBtn = document.getElementById("btn-right");
const shootBtn = document.getElementById("btn-shoot");

leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["ArrowLeft"] = true; });
leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); keys["ArrowLeft"] = false; });

rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); keys["ArrowRight"] = true; });
rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); keys["ArrowRight"] = false; });

shootBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!gameOver) {
        fireLaser();
    } else {
        resetGame();
    }
});

// Canvas Tapping to Restart for mobile
canvas.addEventListener("touchstart", (e) => {
    if (gameOver) resetGame();
});

// Spawn Enemy every 1 second
function spawnEnemy() {
    if (gameOver) return;
    const size = Math.random() * 15 + 20;
    enemies.push({
        x: Math.random() * (canvas.width - size),
        y: -size,
        w: size,
        h: size,
        speed: Math.random() * 1.5 + 1.5,
        color: "#ff3366"
    });
    spawnTimeoutId = setTimeout(spawnEnemy, 1000);
}

// Reset Game State completely
function resetGame() {
    score = 0;
    gameOver = false;
    bullets = [];
    enemies = [];
    player.x = canvas.width / 2 - 20;
    scoreEl.innerText = score;
    clearTimeout(spawnTimeoutId);
    spawnEnemy();
    gameLoop();
}

// Collision Logic
function isColliding(rect1, rect2) {
    return rect1.x < rect2.x + rect2.w &&
           rect1.x + rect1.w > rect2.x &&
           rect1.y < rect2.y + rect2.h &&
           rect1.y + rect1.h > rect2.y;
}

// Main Game Loop
function gameLoop() {
    if (gameOver) {
        ctx.fillStyle = "rgba(3, 3, 13, 0.85)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = "#ff3366";
        ctx.fillStyle = "#ff3366";
        ctx.font = "bold 34px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffffff";
        ctx.font = "16px sans-serif";
        ctx.fillText("Tap Controller or Screen to Restart", canvas.width / 2, canvas.height / 2 + 30);
        return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 1. Move Player (Works with both keyboard inputs and touch toggles)
    if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) player.x -= player.speed;
    if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.w) player.x += player.speed;

    // --- DRAW DETAILED PLAYER AIRCRAFT ---
    ctx.save();
    ctx.shadowBlur = Math.random() * 10 + 10;
    ctx.shadowColor = "#ff9900";
    ctx.fillStyle = Math.random() > 0.5 ? "#ffaa00" : "#ff3300";
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2 - 4, player.y + player.h);
    ctx.lineTo(player.x + player.w / 2, player.y + player.h + 12 + Math.random() * 6);
    ctx.lineTo(player.x + player.w / 2 + 4, player.y + player.h);
    ctx.fill();

    ctx.shadowBlur = 10;
    ctx.shadowColor = player.color;
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y);
    ctx.lineTo(player.x + player.w - 8, player.y + player.h);
    ctx.lineTo(player.x + player.w / 2, player.y + player.h - 6);
    ctx.lineTo(player.x + 8, player.y + player.h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(player.x, player.y + player.h - 10, 4, 10);
    ctx.fillRect(player.x + player.w - 4, player.y + player.h - 10, 4, 10);
    ctx.restore();

    // 2. Update & Draw Bullets
    ctx.save();
    ctx.shadowBlur = 8;
    ctx.shadowColor = "#ffff00";
    ctx.fillStyle = "#ffff00";
    for (let b = bullets.length - 1; b >= 0; b--) {
        bullets[b].y -= bullets[b].speed;
        if (bullets[b].y < 0) {
            bullets.splice(b, 1);
            continue;
        }
        ctx.fillRect(bullets[b].x, bullets[b].y, bullets[b].w, bullets[b].h);
    }
    ctx.restore();

    // 3. Update & Draw Enemies
    for (let e = enemies.length - 1; e >= 0; e--) {
        enemies[e].y += enemies[e].speed;
        
        if (enemies[e].y > canvas.height || isColliding(player, enemies[e])) {
            gameOver = true;
        }

        for (let b = bullets.length - 1; b >= 0; b--) {
            if (isColliding(bullets[b], enemies[e])) {
                enemies.splice(e, 1);
                bullets.splice(b, 1);
                score += 10;
                scoreEl.innerText = score;
                break;
            }
        }

        if (enemies[e]) {
            const en = enemies[e];
            ctx.save();
            ctx.shadowBlur = 8;
            ctx.shadowColor = en.color;
            ctx.fillStyle = en.color;
            ctx.beginPath();
            ctx.moveTo(en.x, en.y);
            ctx.lineTo(en.x + en.w, en.y);
            ctx.lineTo(en.x + en.w - 4, en.y + en.h);
            ctx.lineTo(en.x + en.w - 10, en.y + en.h - 8);
            ctx.lineTo(en.x + 10, en.y + en.h - 8);
